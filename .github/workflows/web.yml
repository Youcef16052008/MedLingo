name: Web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-react
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-react/package-lock.json

      - name: Install
        run: npm ci

      - name: Types
        run: npx tsc --noEmit

      - name: Tests
        run: npx vitest run

      - name: i18n check
        run: npm run check:i18n

      - name: Seed check
        run: npm run check:seed

      # BUG-007 : la parité web/Android des histoires est un garde-fou
      # revendiqué (check-stories.mjs) mais n'était exécutée nulle part en CI.
      - name: Stories parity check
        run: npm run check:stories

      - name: Build
        run: npm run build

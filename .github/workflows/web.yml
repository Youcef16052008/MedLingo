name: Web

# P0.5 : contrôles sur la branche de travail (workflow_dispatch), les PR et
# main. Un push non-main n'est exécuté qu'à la demande → pas de duplication
# push+PR quand une PR est ouverte sur la même branche.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-react
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-react/package-lock.json

      - name: Install
        run: npm ci

      - name: Types
        run: npx tsc --noEmit

      - name: Tests
        run: npx vitest run

      - name: i18n check
        run: npm run check:i18n

      - name: Seed check
        run: npm run check:seed

      # BUG-007 : la parité web/Android des histoires est un garde-fou
      # revendiqué (check-stories.mjs) mais n'était exécutée nulle part en CI.
      - name: Stories parity check
        run: npm run check:stories

      # P0.5 : le précache (service worker) est un artefact vérifié — un
      # fichier hashed non préchargé passerait inaperçu jusqu'au navigateur.
      - name: Precache check
        run: npm run check:precache

      - name: Build
        run: npm run build

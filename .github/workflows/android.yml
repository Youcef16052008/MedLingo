name: Android

# P0.5 : mêmes déclencheurs que web.yml — branche de travail à la demande
# (workflow_dispatch), PR et main ; pas de duplication push+PR.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Android setup (JDK 17, Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # P0.5 : debug.keystore n'est pas commité — build.gradle.kts retombe sur
      # la signature debug standard d'AGP en son absence (aucune clé committée,
      # signature release inchangée).
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: Lint
        # BUG-007/029 : le « || true » masquait tout échec lint — un avertissement
        # qui devient une régression ne doit pas passer inaperçu en CI.
        run: ./gradlew :app:lintDebug --no-daemon --console=plain

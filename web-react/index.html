<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <script>
    /* Direction/ langue avant le premier rendu : sinon un utilisateur AR
       peint d'abord en LTR (lang="fr" statique) puis bascule au montage React. */
    try {
      var _s = JSON.parse(localStorage.getItem("medlingo_web_v1") || "null");
      var _l = _s && (_s.lang === "en" || _s.lang === "ar") ? _s.lang : "fr";
      document.documentElement.lang = _l;
      document.documentElement.dir = _l === "ar" ? "rtl" : "ltr";
    } catch (e) { /* localStorage indisponible → défaut fr/ltr */ }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#146B43">
  <meta name="description" content="MedLingo DZ — L'anglais médical académique & clinique pour les carabins algériens. Flashcards SM-2, quiz et progression hors-ligne.">
  <title>MedLingo DZ — Anglais médical</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png">
  <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Material Symbols Rounded : mêmes formes que les Icons.Filled/Outlined
       d'Android (barre de navigation). Axe FILL : 0 = outlined (repos),
       1 = filled (onglet actif), piloté par CSS (.tabbar a.active). -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,-25..0&display=swap"
    onload="this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,-25..0&display=swap">
  </noscript>
  <!-- Inter : UI + display du design system « Clinical Calm » (grande hauteur
       d'x, chiffres tabulaires pour les scores/XP). IBM Plex Sans Arabic pour
       l'arabe. F3 : chargement non bloquant, le SW met en cache (SWR). -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
    onload="this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  </noscript>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>

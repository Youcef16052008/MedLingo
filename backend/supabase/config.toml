# Supabase config for MedLingo - Duolingo architecture
# Based on Galaxy Apps ECS pattern but simplified for Supabase

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://localhost:54321"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
port = 54325
file_size_limit = "50MiB"
# S3 course data like Duolingo S3 lake
[[storage.buckets]]
id = "course-data"
name = "course-data"
public = true
file_size_limit = "100MiB"
allowed_mime_types = ["application/json", "image/*", "audio/*"]

[[storage.buckets]]
id = "user-avatars"
name = "user-avatars"
public = true

[[storage.buckets]]
id = "medical-images"
name = "medical-images"
public = true

[auth]
enabled = true
port = 54325
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://medlingo.dz", "com.aistudio.medlingua.dzmed://"]
jwt_expiry = 3600
enable_signup = true
enable_confirmations = false
enable_manual_linking = true
# Phone OTP like Haina Vietnam localisation
enable_phone_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = true
# Use Twilio or custom SMS for DZ

[auth.external.apple]
enabled = false

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"

# Realtime - like Kafka lite + FIFO SQS for notifications
[realtime]
enabled = true
port = 54325
# Enable for league updates, notifications

[analytics]
enabled = false
port = 54327
vector_port = 54328

# Edge Functions - like Galaxy Apps microservices
[functions.session-generator]
enabled = true
verify_jwt = true
import_map = "./functions/session-generator/import_map.json"
entrypoint = "./functions/session-generator/index.ts"

[functions.birdbrain]
enabled = true
verify_jwt = true
import_map = "./functions/birdbrain/import_map.json"
entrypoint = "./functions/birdbrain/index.ts"

[functions.notifications]
enabled = true
verify_jwt = true
entrypoint = "./functions/notifications/index.ts"

[functions.league-cron]
enabled = true
verify_jwt = true
entrypoint = "./functions/league-cron/index.ts"
